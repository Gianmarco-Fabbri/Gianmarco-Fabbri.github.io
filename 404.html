<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found - Gianmarco Fabbri</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0f172a;
            color: #94a3b8;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
            padding: 0 1rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.75rem;
            color: #f8fafc;
        }

        a {
            color: #38bdf8;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        // Pages of the previous site (/it/..., /en/...) now live on the home page
        if (/^\/(it|en)(\/|$)/.test(location.pathname)) location.replace("/");
    </script>
</head>

<body>
    <main>
        <h1>Page not found</h1>
        <p>This page doesn't exist. <a href="/">Go to the home page &rarr;</a></p>
    </main>
</body>

</html>
